name: MLS Image Generator

on:
  workflow_dispatch:

jobs:
  generate-image:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate MLS infographic prompt
        run: |
          set -euo pipefail

          TOPIC="How to Read a Lipid Panel"
          CATEGORY="Lipids"
          ANGLE="How to Read / Interpretation"
          TITLE="How to Read LDL, HDL and Triglycerides"

          echo "===== MLS IMAGE GENERATOR ====="
          echo "Topic: $TOPIC"
          echo "Category: $CATEGORY"
          echo "Angle: $ANGLE"
          echo "Title: $TITLE"

          echo ""
          echo "===== IMAGE FORMAT ====="
          echo "Aspect Ratio: 4:5"
          echo "Format: Vertical educational infographic"
          echo "Resolution: High resolution"

          echo ""
          echo "===== DESIGN STYLE ====="
          echo "Professional medical infographic"
          echo "Text-dominant layout"
          echo "Clean clinical appearance"
          echo "Light medical background"
          echo "Dark top banner"
          echo "Dark section banners"
          echo "Large bold readable typography"
          echo "High contrast text"
          echo "Minimal realistic medical visuals"
          echo "No cartoon elements"
          echo "No stickers"
          echo "No unnecessary decorative elements"

          echo ""
          echo "===== CONTENT ====="
          echo "HOOK: Your lipid panel has several numbers. Which ones actually matter?"
          echo "LDL: One of the main atherogenic cholesterol measures used in cardiovascular risk assessment."
          echo "HDL: One component of the lipid profile. HDL alone does not determine overall cardiovascular risk."
          echo "TRIGLYCERIDES: A type of fat in the blood. Very high levels have clinical significance and are associated with pancreatitis risk."
          echo "TOTAL CHOLESTEROL: Represents cholesterol carried in several lipoprotein particles and should be interpreted with the rest of the lipid profile."
          echo "COMPLETE PATTERN: Interpret the complete lipid profile with overall cardiovascular risk and clinical context."

          echo ""
          echo "===== ACCURACY ====="
          echo "No universal treatment target"
          echo "Separate reference ranges from treatment targets"
          echo "Do not diagnose cardiovascular disease from a lipid panel alone"
          echo "Do not describe HDL alone as complete cardiovascular protection"

          echo ""
          echo "===== BOTTOM TAKEAWAY ====="
          echo "READ THE COMPLETE LIPID PATTERN, NOT ONE NUMBER ALONE"

          echo ""
          echo "===== MLS IMAGE GENERATOR COMPLETE ====="
