name: MLS Post Analysis

on:
  workflow_dispatch:

jobs:
  analyze-posts:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Analyze MLS post database
        run: |
          set -euo pipefail

          FILE="data/mls_posts.json"

          if [ ! -f "$FILE" ]; then
            echo "Database file not found: $FILE"
            exit 1
          fi

          echo "===== MLS POST DATABASE ANALYSIS ====="

          TOTAL=$(jq 'length' "$FILE")
          TITLES=$(jq '[.[] | select(.title != null and .title != "")] | length' "$FILE")
          TOTAL_SHARES=$(jq '[.[].shares_count] | add')
          AVERAGE_SHARES=$(jq '[.[].shares_count] | add / length')
          MEDIAN_SHARES=$(jq '[.[].shares_count] | sort | .[length / 2 | floor]')

          echo "Total posts: $TOTAL"
          echo "Posts with titles: $TITLES"
          echo "Total shares: $TOTAL_SHARES"
          echo "Average shares: $AVERAGE_SHARES"
          echo "Median shares: $MEDIAN_SHARES"

          echo ""
          echo "===== TOP 10 POSTS BY SHARES ====="

          jq -r '
            sort_by(.shares_count)
            | reverse
            | .[0:10]
            | .[]
            | "\(.shares_count) shares | \(.title // "No title") | \(.created_time)"
          ' "$FILE"

          echo ""
          echo "===== TITLE COVERAGE ====="

          jq -r '
            .[]
            | if (.title != null and .title != "")
              then "HAS_TITLE"
              else "NO_TITLE"
              end
          ' "$FILE" | sort | uniq -c

          echo ""
          echo "===== SHARE COUNT DISTRIBUTION ====="

          jq '
            {
              zero_shares: ([.[] | select(.shares_count == 0)] | length),
              one_to_five: ([.[] | select(.shares_count >= 1 and .shares_count <= 5)] | length),
              six_to_ten: ([.[] | select(.shares_count >= 6 and .shares_count <= 10)] | length),
              eleven_to_twenty_five: ([.[] | select(.shares_count >= 11 and .shares_count <= 25)] | length),
              over_twenty_five: ([.[] | select(.shares_count > 25)] | length)
            }
          ' "$FILE"

          echo ""
          echo "===== CONTENT ANGLE SHARE PERFORMANCE ====="

          jq -r '
            .[]
            | (
                (.title // "") + " " + (.message // "")
                | ascii_downcase
              ) as $text
            | (
                if ($text | test("how to read|how to interpret|interpretation|what high and low means|what high or low means"))
                then "How to Read / Interpretation"

                elif ($text | test("\\bvs\\b|versus|difference between|compared with|comparison"))
                then "X vs Y / Comparison"

                elif ($text | test("high vs low|high and low|low and high|normal vs|normal and abnormal"))
                then "High vs Low / Normal"

                elif ($text | test("normal range|reference range|normal values|normal level|normal count"))
                then "Normal / Reference Range"

                elif ($text | test("causes|cause of|symptoms|signs and symptoms"))
                then "Causes / Symptoms"

                elif ($text | test("test for|testing|blood test|urine test|diagnosis|diagnostic"))
                then "Test / Diagnosis"

                elif ($text | test("guide|steps|how to|procedure|workflow"))
                then "Guide / Steps"

                elif ($text | test("mistake|mistakes|error|errors|wrong|false low|false high|falsely"))
                then "Mistakes / Errors"

                elif ($text | test("how many|identify|recognize|quiz|test yourself"))
                then "Identify / Quiz"

                elif ($text | test("remember|easy way|memory|mnemonic"))
                then "Remember / Easy Way"

                elif ($text | test("rules|safety|safe lab|precautions|ppe|sterilization"))
                then "Rules / Safety"

                else "General Explanation"
                end
              ) as $angle
            | [$angle, .shares_count]
            | @tsv
          ' "$FILE" \
          | jq -R -s '
              split("\n")
              | map(select(length > 0))
              | map(split("\t"))
              | group_by(.[0])
              | map({
                  angle: .[0][0],
                  posts: length,
                  total_shares: (map(.[1] | tonumber) | add),
                  average_shares: (
                    (map(.[1] | tonumber) | add) / length
                  ),
                  median_shares: (
                    map(.[1] | tonumber)
                    | sort
                    | .[length / 2 | floor]
                  )
                })
              | sort_by(.average_shares)
              | reverse
          '

          echo ""
          echo "===== TOP POSTS BY CONTENT ANGLE ====="

          jq -r '
            .[]
            | (
                (.title // "") + " " + (.message // "")
                | ascii_downcase
              ) as $text
            | (
                if ($text | test("how to read|how to interpret|interpretation|what high and low means|what high or low means"))
                then "How to Read / Interpretation"

                elif ($text | test("\\bvs\\b|versus|difference between|compared with|comparison"))
                then "X vs Y / Comparison"

                elif ($text | test("high vs low|high and low|low and high|normal vs|normal and abnormal"))
                then "High vs Low / Normal"

                elif ($text | test("normal range|reference range|normal values|normal level|normal count"))
                then "Normal / Reference Range"

                elif ($text | test("causes|cause of|symptoms|signs and symptoms"))
                then "Causes / Symptoms"

                elif ($text | test("test for|testing|blood test|urine test|diagnosis|diagnostic"))
                then "Test / Diagnosis"

                elif ($text | test("guide|steps|how to|procedure|workflow"))
                then "Guide / Steps"

                elif ($text | test("mistake|mistakes|error|errors|wrong|false low|false high|falsely"))
                then "Mistakes / Errors"

                elif ($text | test("how many|identify|recognize|quiz|test yourself"))
                then "Identify / Quiz"

                elif ($text | test("remember|easy way|memory|mnemonic"))
                then "Remember / Easy Way"

                elif ($text | test("rules|safety|safe lab|precautions|ppe|sterilization"))
                then "Rules / Safety"

                else "General Explanation"
                end
              ) as $angle
            | {
                angle: $angle,
                shares: .shares_count,
                title: (.title // "No title")
              }
            | "\(.angle)\t\(.shares)\t\(.title)"
          ' "$FILE" \
          | sort -t $'\t' -k1,1 -k2,2nr \
          | awk -F '\t' '
              {
                count[$1]++
                if (count[$1] <= 5)
                  print $1 " | " $2 " shares | " $3
              }
          '
