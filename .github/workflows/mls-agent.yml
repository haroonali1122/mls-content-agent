name: MLS Post Database

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect-posts:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Collect Page posts
        env:
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail

          PAGE_ID="1845536968999866"
          API_VERSION="v26.0"
          URL="https://graph.facebook.com/${API_VERSION}/${PAGE_ID}/posts"

          mkdir -p data
          rm -f /tmp/mls_posts.jsonl

          for PAGE in 1 2 3 4 5; do
            echo "Reading page ${PAGE}..."

            RESPONSE=$(curl -sS --get "$URL" \
              --data-urlencode "fields=id,message,created_time,shares" \
              --data-urlencode "limit=100" \
              --data-urlencode "access_token=${META_PAGE_ACCESS_TOKEN}")

            if echo "$RESPONSE" | jq -e '.error' >/dev/null; then
              echo "Meta API returned an error:"
              echo "$RESPONSE" | jq .
              exit 1
            fi

            echo "$RESPONSE" | jq -c '.data[]' >> /tmp/mls_posts.jsonl

            NEXT_URL=$(echo "$RESPONSE" | jq -r '.paging.next // empty')

            if [ -z "$NEXT_URL" ]; then
              echo "No more pages."
              break
            fi

            URL="$NEXT_URL"
          done

          jq -s '
            unique_by(.id)
            | map(
                .title = (
                  if (.message | type) == "string" then
                    (
                      .message
                      | split("\n")
                      | map(select(length > 0))
                      | .[0] // ""
                    )
                  else
                    ""
                  end
                )
                | .shares_count = (.shares.count // 0)
                | del(.shares)
              )
            | sort_by(.created_time)
            | reverse
          ' /tmp/mls_posts.jsonl > data/mls_posts.json

          echo "Collected posts:"
          jq 'length' data/mls_posts.json

          echo "Posts with share counts:"
          jq '[.[] | select(.shares_count != null)] | length' data/mls_posts.json

          echo "Posts with titles:"
          jq '[.[] | select(.title != null and .title != "")] | length' data/mls_posts.json

          echo "Database preview:"
          jq '.[0:5]' data/mls_posts.json

      - name: Save database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/mls_posts.json

          if git diff --cached --quiet; then
            echo "No database changes."
          else
            git commit -m "Add titles to MLS post database"
            git push
          fi
