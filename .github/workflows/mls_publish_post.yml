name: MLS Publish Post

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-post:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Publish MLS post to Facebook
        env:
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail

          PAGE_ID="1845536968999866"
          API_VERSION="v26.0"

          TITLE="How to Read LDL, HDL and Triglycerides"

          CAPTION=$(cat <<'EOF'
          A lipid panel includes several measurements, and each one provides different information.

          1. LDL CHOLESTEROL
          LDL is one of the main atherogenic cholesterol measures used in cardiovascular risk assessment. Its interpretation depends on overall cardiovascular risk and clinical context.

          2. HDL CHOLESTEROL
          HDL is one component of the lipid profile. HDL alone should not be used to determine overall cardiovascular risk.

          3. TRIGLYCERIDES
          Triglycerides measure a type of fat in the blood. Very high levels have clinical significance and are associated with pancreatitis risk.

          4. TOTAL CHOLESTEROL
          Total cholesterol represents cholesterol carried in several lipoprotein particles. It should be interpreted together with the other lipid measurements.

          5. THE COMPLETE PATTERN
          One lipid value alone does not determine overall cardiovascular risk. The complete lipid profile should be interpreted together with overall cardiovascular risk and clinical context.

          Read the complete lipid pattern, not one number alone.

          #LipidPanel
          #Cholesterol
          #LDL
          #HDL
          #Triglycerides
          EOF
          )

          echo "===== MLS FACEBOOK PUBLISHER ====="
          echo ""
          echo "Page ID: ${PAGE_ID}"
          echo "Title: ${TITLE}"
          echo ""
          echo "===== CAPTION ====="
          echo "$CAPTION"

          echo ""
          echo "===== CHECKING META API ====="

          RESPONSE=$(curl -sS --get \
            "https://graph.facebook.com/${API_VERSION}/${PAGE_ID}" \
            --data-urlencode "fields=id,name" \
            --data-urlencode "access_token=${META_PAGE_ACCESS_TOKEN}")

          if echo "$RESPONSE" | jq -e '.error' >/dev/null; then
            echo "Meta API returned an error:"
            echo "$RESPONSE" | jq .
            exit 1
          fi

          echo "$RESPONSE" | jq .

          echo ""
          echo "===== PUBLISHING STATUS ====="
          echo "Meta API connection: PASS"
          echo "Caption prepared: PASS"
          echo "Image publishing: NOT RUN"

          echo ""
          echo "IMPORTANT:"
          echo "This workflow does NOT publish yet."
          echo "The image URL/file must be connected before enabling automatic publishing."

          echo ""
          echo "===== MLS FACEBOOK PUBLISHER CHECK COMPLETE ====="
