name: MLS Topic Opportunity Score

on:
  workflow_dispatch:

jobs:
  score-topics:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Score MLS Topics
        run: |
          set -euo pipefail

          FILE="data/mls_posts.json"

          if [ ! -f "$FILE" ]; then
            echo "Database file not found: $FILE"
            exit 1
          fi

          echo "===== MLS TOPIC OPPORTUNITY SCORING ====="

          echo ""
          echo "Scoring factors:"
          echo "1. U.S. Search Intent"
          echo "2. Problem Severity"
          echo "3. MLS Audience Relevance"
          echo "4. Medical Educational Value"
          echo "5. Visual Infographic Potential"
          echo "6. Curiosity / Hook Potential"
          echo "7. Engagement Potential"
          echo "8. Follow Potential"
          echo "9. Monetization Potential"
          echo "10. Evidence Strength"

          echo ""
          echo "===== CANDIDATE TOPICS ====="

          cat <<'EOF'
          1. How to Read a CBC Report
          2. How to Read an HbA1c Report
          3. How to Read a Lipid Panel
          4. How to Read ALT, AST and ALP
          5. Creatinine and eGFR Explained
          6. TSH, T3 and T4 Explained
          7. Blood Glucose Results Explained
          8. CBC High vs Low Results
          9. LDL vs HDL vs Triglycerides
          10. Liver Function Test Interpretation
          11. CBC Test and Diagnosis
          12. Blood Collection Guide
          EOF

