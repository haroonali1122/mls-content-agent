name: MLS Next Topic

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  select-next-topic:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select next MLS topic
        run: |
          set -euo pipefail

          FILE="data/mls_posts.json"

          if [ ! -f "$FILE" ]; then
            echo "Database file not found: $FILE"
            exit 1
          fi

          TOTAL=$(jq 'length' "$FILE")

          echo "===== MLS NEXT TOPIC ENGINE ====="
          echo "Historical posts analyzed: $TOTAL"

          echo ""
          echo "===== CURRENT HISTORICAL SIGNAL ====="

          jq -r '
            .[]
            | "\(.shares_count // 0) shares | \(.title // "No title")"
          ' "$FILE" \
          | sort -nr \
          | sed -n '1,20p'

          echo ""
          echo "===== TOPIC CANDIDATES ====="

          cat > /tmp/candidates.json <<'EOF'
          [
            {
              "topic": "How to Read a CBC Report",
              "category": "CBC / Hematology",
              "angle": "How to Read / Interpretation",
              "historical_average": 229.7,
              "historical_posts": 27,
              "search_intent": 9,
              "opportunity": 92,
              "confidence": "HIGH"
            },
            {
              "topic": "How to Read an HbA1c Report",
              "category": "Diabetes / Glucose",
              "angle": "How to Read / Interpretation",
              "historical_average": 170.9,
              "historical_posts": 82,
              "search_intent": 10,
              "opportunity": 97,
              "confidence": "HIGH"
            },
            {
              "topic": "How to Read ALT, AST and ALP",
              "category": "Liver / Hepatitis",
              "angle": "How to Read / Interpretation",
              "historical_average": 145.9,
              "historical_posts": 31,
              "search_intent": 8,
              "opportunity": 90,
              "confidence": "HIGH"
            },
            {
              "topic": "Creatinine and eGFR Explained",
              "category": "Kidney / Renal",
              "angle": "Test / Diagnosis",
              "historical_average": 196,
              "historical_posts": 1,
              "search_intent": 9,
              "opportunity": 90,
              "confidence": "LOW"
            },
            {
              "topic": "Blood Glucose Results Explained",
              "category": "Diabetes / Glucose",
              "angle": "Test / Diagnosis",
              "historical_average": 134.75,
              "historical_posts": 16,
              "search_intent": 10,
              "opportunity": 93,
              "confidence": "MEDIUM"
            },
            {
              "topic": "Liver Function Test Interpretation",
              "category": "Liver / Hepatitis",
              "angle": "How to Read / Interpretation",
              "historical_average": 145.9,
              "historical_posts": 31,
              "search_intent": 9,
              "opportunity": 89,
              "confidence": "HIGH"
            },
            {
              "topic": "CBC Test and Diagnosis",
              "category": "CBC / Hematology",
              "angle": "Test / Diagnosis",
              "historical_average": 127.3,
              "historical_posts": 34,
              "search_intent": 9,
              "opportunity": 90,
              "confidence": "HIGH"
            },
            {
              "topic": "Blood Collection Guide",
              "category": "Specimen Collection",
              "angle": "Guide / Steps",
              "historical_average": 130.3,
              "historical_posts": 18,
              "search_intent": 7,
              "opportunity": 82,
              "confidence": "MEDIUM"
            },
            {
              "topic": "TSH, T3 and T4 Explained",
              "category": "Thyroid",
              "angle": "How to Read / Interpretation",
              "historical_average": 81,
              "historical_posts": 5,
              "search_intent": 9,
              "opportunity": 87,
              "confidence": "LOW"
            }
          ]
          EOF

          echo ""
          echo "===== BUILDING PUBLISHED TOPIC INDEX ====="

          jq -r '
            .[]
            | (.title // "")
            | ascii_downcase
          ' "$FILE" > /tmp/published_titles.txt

          echo ""
          echo "===== FILTERING PUBLISHED TOPICS ====="

          jq -c '.[]' /tmp/candidates.json |
          while read -r candidate; do
            TOPIC=$(echo "$candidate" | jq -r '.topic')

            if grep -Fqi "$TOPIC" /tmp/published_titles.txt; then
              echo "EXCLUDE: $TOPIC"
            else
              echo "KEEP: $TOPIC"
            fi
          done

          echo ""
          echo "===== REMOVING ALREADY PUBLISHED TOPICS ====="

          jq -c '
            .[]
          ' /tmp/candidates.json |
          while read -r candidate; do
            TOPIC=$(echo "$candidate" | jq -r '.topic')

            if ! grep -Fqi "$TOPIC" /tmp/published_titles.txt; then
              echo "$candidate"
            fi
          done > /tmp/available_candidates.jsonl

          if [ ! -s /tmp/available_candidates.jsonl ]; then
            echo "No unpublished candidate topics remain."
            exit 1
          fi

          jq -s '.' /tmp/available_candidates.jsonl > /tmp/available_candidates.json

          echo ""
          echo "===== AVAILABLE CANDIDATES ====="
          jq '.' /tmp/available_candidates.json

          echo ""
          echo "===== FINAL TOPIC CALCULATION ====="

          jq '
            map(
              .score = (
                (.opportunity * 0.40)
                + ((.historical_average / 5) * 0.30)
                + (.search_intent * 3)
                + (
                    if .confidence == "HIGH" then 10
                    elif .confidence == "MEDIUM" then 5
                    else 0
                    end
                  )
              )
            )
            | sort_by(.score)
            | reverse
          ' /tmp/available_candidates.json > /tmp/ranked_candidates.json

          echo ""
          echo "===== FINAL RANKING ====="

          jq '
            map({
              topic: .topic,
              category: .category,
              angle: .angle,
              score: (.score | round),
              historical_average: .historical_average,
              historical_posts: .historical_posts,
              opportunity: .opportunity,
              confidence: .confidence
            })
          ' /tmp/ranked_candidates.json

          NEXT=$(jq '.[0]' /tmp/ranked_candidates.json)

          TOPIC=$(echo "$NEXT" | jq -r '.topic')
          CATEGORY=$(echo "$NEXT" | jq -r '.category')
          ANGLE=$(echo "$NEXT" | jq -r '.angle')
          SCORE=$(echo "$NEXT" | jq -r '.score')
          OPPORTUNITY=$(echo "$NEXT" | jq -r '.opportunity')
          HISTORICAL_AVG=$(echo "$NEXT" | jq -r '.historical_average')
          HISTORICAL_POSTS=$(echo "$NEXT" | jq -r '.historical_posts')
          CONFIDENCE=$(echo "$NEXT" | jq -r '.confidence')

          echo ""
          echo "===== SELECTED NEXT TOPIC ====="
          echo "Topic: $TOPIC"
          echo "Category: $CATEGORY"
          echo "Angle: $ANGLE"
          echo "Final score: $SCORE"
          echo "Opportunity score: $OPPORTUNITY"
          echo "Historical average shares: $HISTORICAL_AVG"
          echo "Historical posts: $HISTORICAL_POSTS"
          echo "Confidence: $CONFIDENCE"

          mkdir -p output

          cat > output/mls_next_topic.txt <<EOF
          ===== MLS NEXT TOPIC =====

          Topic:
          $TOPIC

          Category:
          $CATEGORY

          Recommended angle:
          $ANGLE

          Final score:
          $SCORE

          Opportunity score:
          $OPPORTUNITY

          Historical average shares:
          $HISTORICAL_AVG

          Historical posts:
          $HISTORICAL_POSTS

          Evidence confidence:
          $CONFIDENCE

          ===== NEXT CONTENT PIPELINE =====

          USA Search Research
          Medical Evidence Validation
          Content Angle
          Content Blueprint
          Title Engine
          Content Writer
          Image Prompt
          Image Generation
          Facebook Publishing

          ===== MLS NEXT TOPIC COMPLETE =====
          EOF

          echo ""
          cat output/mls_next_topic.txt

      - name: Upload next topic
        uses: actions/upload-artifact@v4
        with:
          name: mls-next-topic
          path: output/mls_next_topic.txt

      - name: Save next topic
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add output/mls_next_topic.txt

          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Add next MLS topic"
            git push
          fi

          echo "===== MLS NEXT TOPIC ENGINE COMPLETE ====="
