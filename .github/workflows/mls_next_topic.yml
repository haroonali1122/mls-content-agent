name: MLS Next Topic

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  select-next-topic:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select next MLS topic
        run: |
          set -euo pipefail

          POSTS_FILE="data/mls_posts.json"
          HISTORY_FILE="data/mls_topic_history.json"

          if [ ! -f "$POSTS_FILE" ]; then
            echo "Database file not found: $POSTS_FILE"
            exit 1
          fi

          if [ ! -f "$HISTORY_FILE" ]; then
            echo "Topic history file not found: $HISTORY_FILE"
            exit 1
          fi

          if ! jq empty "$POSTS_FILE" >/dev/null 2>&1; then
            echo "Invalid JSON: $POSTS_FILE"
            exit 1
          fi

          if ! jq empty "$HISTORY_FILE" >/dev/null 2>&1; then
            echo "Invalid JSON: $HISTORY_FILE"
            exit 1
          fi

          TOTAL=$(jq 'length' "$POSTS_FILE")

          echo "===== MLS NEXT TOPIC ENGINE ====="
          echo "Historical posts analyzed: $TOTAL"

          echo ""
          echo "===== CURRENT HISTORICAL SIGNAL ====="

          jq -r '
            .[]
            | "\(.shares_count // 0) shares | \(.title // "No title")"
          ' "$POSTS_FILE" \
          | sort -nr \
          | sed -n '1,20p'

          echo ""
          echo "===== TOPIC CANDIDATES ====="

          cat > /tmp/candidates.json <<'EOF'
          [
            {
              "topic": "How to Read a CBC Report",
              "topic_family": "CBC",
              "category": "CBC / Hematology",
              "angle": "How to Read / Interpretation",
              "historical_average": 229.7,
              "historical_posts": 27,
              "search_intent": 9,
              "opportunity": 92,
              "confidence": "HIGH"
            },
            {
              "topic": "How to Read an HbA1c Report",
              "topic_family": "HbA1c",
              "category": "Diabetes / Glucose",
              "angle": "How to Read / Interpretation",
              "historical_average": 170.9,
              "historical_posts": 82,
              "search_intent": 10,
              "opportunity": 97,
              "confidence": "HIGH"
            },
            {
              "topic": "How to Read ALT, AST and ALP",
              "topic_family": "Liver Enzymes",
              "category": "Liver / Hepatitis",
              "angle": "How to Read / Interpretation",
              "historical_average": 145.9,
              "historical_posts": 31,
              "search_intent": 8,
              "opportunity": 90,
              "confidence": "HIGH"
            },
            {
              "topic": "Creatinine and eGFR Explained",
              "topic_family": "Kidney Function",
              "category": "Kidney / Renal",
              "angle": "Test / Diagnosis",
              "historical_average": 196,
              "historical_posts": 1,
              "search_intent": 9,
              "opportunity": 90,
              "confidence": "LOW"
            },
            {
              "topic": "Blood Glucose Results Explained",
              "topic_family": "Blood Glucose",
              "category": "Diabetes / Glucose",
              "angle": "Test / Diagnosis",
              "historical_average": 134.75,
              "historical_posts": 16,
              "search_intent": 10,
              "opportunity": 93,
              "confidence": "MEDIUM"
            },
            {
              "topic": "Liver Function Test Interpretation",
              "topic_family": "Liver Function Test",
              "category": "Liver / Hepatitis",
              "angle": "How to Read / Interpretation",
              "historical_average": 145.9,
              "historical_posts": 31,
              "search_intent": 9,
              "opportunity": 89,
              "confidence": "HIGH"
            },
            {
              "topic": "CBC Test and Diagnosis",
              "topic_family": "CBC",
              "category": "CBC / Hematology",
              "angle": "Test / Diagnosis",
              "historical_average": 127.3,
              "historical_posts": 34,
              "search_intent": 9,
              "opportunity": 90,
              "confidence": "HIGH"
            },
            {
              "topic": "Blood Collection Guide",
              "topic_family": "Blood Collection",
              "category": "Specimen Collection",
              "angle": "Guide / Steps",
              "historical_average": 130.3,
              "historical_posts": 18,
              "search_intent": 7,
              "opportunity": 82,
              "confidence": "MEDIUM"
            },
            {
              "topic": "TSH, T3 and T4 Explained",
              "topic_family": "Thyroid",
              "category": "Thyroid",
              "angle": "How to Read / Interpretation",
              "historical_average": 81,
              "historical_posts": 5,
              "search_intent": 9,
              "opportunity": 87,
              "confidence": "LOW"
            }
          ]
          EOF

          echo ""
          echo "===== HISTORY ====="

          HISTORY_COUNT=$(jq 'length' "$HISTORY_FILE")
          echo "Recorded topic/angle combinations: $HISTORY_COUNT"

          if [ "$HISTORY_COUNT" -gt 0 ]; then
            jq '.' "$HISTORY_FILE"
          else
            echo "No topic history recorded yet."
          fi

          echo ""
          echo "===== BUILDING HISTORICAL TITLE INDEX ====="

          jq -r '
            .[]
            | (.title // "")
            | ascii_downcase
          ' "$POSTS_FILE" > /tmp/published_titles.txt

          echo ""
          echo "===== FILTERING CANDIDATES ====="

          jq -c '.[]' /tmp/candidates.json |
          while read -r candidate; do

            TOPIC=$(echo "$candidate" | jq -r '.topic')
            TOPIC_FAMILY=$(echo "$candidate" | jq -r '.topic_family')
            ANGLE=$(echo "$candidate" | jq -r '.angle')

            TOPIC_USED=$(jq --arg family "$TOPIC_FAMILY" '
              any(.[]; (.topic_family // "") == $family)
            ' "$HISTORY_FILE")

            ANGLE_USED=$(jq --arg family "$TOPIC_FAMILY" --arg angle "$ANGLE" '
              any(
                .[];
                (.topic_family // "") == $family
                and (.angle // "") == $angle
              )
            ' "$HISTORY_FILE")

            TITLE_USED=$(grep -Fqi "$TOPIC" /tmp/published_titles.txt && echo true || echo false)

            if [ "$TOPIC_USED" = "true" ]; then
              echo "EXCLUDE topic family: $TOPIC_FAMILY"
            elif [ "$ANGLE_USED" = "true" ]; then
              echo "EXCLUDE topic + angle: $TOPIC | $ANGLE"
            elif [ "$TITLE_USED" = "true" ]; then
              echo "EXCLUDE existing title: $TOPIC"
            else
              echo "KEEP: $TOPIC | $ANGLE"
            fi

          done

          echo ""
          echo "===== CREATING AVAILABLE CANDIDATES ====="

          jq -c '.[]' /tmp/candidates.json |
          while read -r candidate; do

            TOPIC=$(echo "$candidate" | jq -r '.topic')
            TOPIC_FAMILY=$(echo "$candidate" | jq -r '.topic_family")
            ANGLE=$(echo "$candidate" | jq -r '.angle')

            TOPIC_USED=$(jq --arg family "$TOPIC_FAMILY" '
              any(.[]; (.topic_family // "") == $family)
            ' "$HISTORY_FILE")

            ANGLE_USED=$(jq --arg family "$TOPIC_FAMILY" --arg angle "$ANGLE" '
              any(
                .[];
                (.topic_family // "") == $family
                and (.angle // "") == $angle
              )
            ' "$HISTORY_FILE")

            TITLE_USED=false

            if grep -Fqi "$TOPIC" /tmp/published_titles.txt; then
              TITLE_USED=true
            fi

            if [ "$TOPIC_USED" != "true" ] &&
               [ "$ANGLE_USED" != "true" ] &&
               [ "$TITLE_USED" != "true" ]; then
              echo "$candidate"
            fi

          done > /tmp/available_candidates.jsonl

          if [ ! -s /tmp/available_candidates.jsonl ]; then
            echo "No unused candidate combinations remain."
            exit 1
          fi

          jq -s '.' /tmp/available_candidates.jsonl > /tmp/available_candidates.json

          echo ""
          echo "===== AVAILABLE CANDIDATES ====="
          jq '.' /tmp/available_candidates.json

          echo ""
          echo "===== CALCULATING SCORES ====="

          jq '
            map(
              .score = (
                (.opportunity * 0.40)
                + ((.historical_average / 5) * 0.30)
                + (.search_intent * 3)
                + (
                    if .confidence == "HIGH" then 10
                    elif .confidence == "MEDIUM" then 5
                    else 0
                    end
                  )
              )
            )
            | sort_by(.score)
            | reverse
          ' /tmp/available_candidates.json > /tmp/ranked_candidates.json

          echo ""
          echo "===== FINAL RANKING ====="

          jq '
            map({
              topic: .topic,
              topic_family: .topic_family,
              category: .category,
              angle: .angle,
              score: .score,
              historical_average: .historical_average,
              historical_posts: .historical_posts,
              opportunity: .opportunity,
              confidence: .confidence
            })
          ' /tmp/ranked_candidates.json

          NEXT=$(jq '.[0]' /tmp/ranked_candidates.json)

          TOPIC=$(echo "$NEXT" | jq -r '.topic')
          TOPIC_FAMILY=$(echo "$NEXT" | jq -r '.topic_family')
          CATEGORY=$(echo "$NEXT" | jq -r '.category')
          ANGLE=$(echo "$NEXT" | jq -r '.angle')
          SCORE=$(echo "$NEXT" | jq -r '.score')
          OPPORTUNITY=$(echo "$NEXT" | jq -r '.opportunity')
          HISTORICAL_AVG=$(echo "$NEXT" | jq -r '.historical_average')
          HISTORICAL_POSTS=$(echo "$NEXT" | jq -r '.historical_posts')
          CONFIDENCE=$(echo "$NEXT" | jq -r '.confidence')

          echo ""
          echo "===== SELECTED NEXT TOPIC ====="

          echo "Topic: $TOPIC"
          echo "Topic family: $TOPIC_FAMILY"
          echo "Category: $CATEGORY"
          echo "Angle: $ANGLE"
          echo "Final score: $SCORE"
          echo "Opportunity score: $OPPORTUNITY"
          echo "Historical average shares: $HISTORICAL_AVG"
          echo "Historical posts: $HISTORICAL_POSTS"
          echo "Confidence: $CONFIDENCE"

          echo ""
          echo "===== UPDATING TOPIC HISTORY ====="

          jq \
            --arg topic "$TOPIC" \
            --arg family "$TOPIC_FAMILY" \
            --arg category "$CATEGORY" \
            --arg angle "$ANGLE" \
            --argjson score "$SCORE" \
            --argjson opportunity "$OPPORTUNITY" \
            --argjson historical_average "$HISTORICAL_AVG" \
            --argjson historical_posts "$HISTORICAL_POSTS" \
            --arg confidence "$CONFIDENCE" \
            '. + [{
              topic: $topic,
              topic_family: $family,
              category: $category,
              angle: $angle,
              score: $score,
              opportunity: $opportunity,
              historical_average: $historical_average,
              historical_posts: $historical_posts,
              confidence: $confidence,
              status: "selected"
            }]'
            "$HISTORY_FILE" > /tmp/mls_topic_history.json

          mv /tmp/mls_topic_history.json "$HISTORY_FILE"

          echo ""
          echo "===== UPDATED HISTORY ====="
          jq '.' "$HISTORY_FILE"

          mkdir -p output

          cat > output/mls_next_topic.txt <<EOF
          ===== MLS NEXT TOPIC =====

          Topic:
          $TOPIC

          Topic family:
          $TOPIC_FAMILY

          Category:
          $CATEGORY

          Recommended angle:
          $ANGLE

          Final score:
          $SCORE

          Opportunity score:
          $OPPORTUNITY

          Historical average shares:
          $HISTORICAL_AVG

          Historical posts:
          $HISTORICAL_POSTS

          Evidence confidence:
          $CONFIDENCE

          ===== NEXT CONTENT PIPELINE =====

          USA Search Research
          Medical Evidence Validation
          Content Angle
          Content Blueprint
          Title Engine
          Content Writer
          Image Prompt
          Image Generation
          Facebook Publishing

          ===== MLS NEXT TOPIC COMPLETE =====
          EOF

          echo ""
          cat output/mls_next_topic.txt

      - name: Upload next topic
        uses: actions/upload-artifact@v4
        with:
          name: mls-next-topic
          path: output/mls_next_topic.txt

      - name: Save topic history and next topic
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/mls_topic_history.json output/mls_next_topic.txt

          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update MLS topic history and next topic"
            git push
          fi

          echo "===== MLS NEXT TOPIC ENGINE COMPLETE ====="
