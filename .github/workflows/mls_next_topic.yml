name: MLS Next Topic

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  select-next-topic:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select next MLS topic
        run: |
          set -euo pipefail

          FILE="data/mls_posts.json"

          if [ ! -f "$FILE" ]; then
            echo "Database file not found: $FILE"
            exit 1
          fi

          TOTAL=$(jq 'length' "$FILE")

          echo "===== MLS NEXT TOPIC ENGINE ====="
          echo "Historical posts analyzed: $TOTAL"

          echo ""
          echo "===== CURRENT HISTORICAL SIGNAL ====="

          jq -r '
            .[]
            | {
                title: (.title // ""),
                shares: (.shares_count // 0)
              }
            | select(.shares > 0)
            | "\(.shares) shares | \(.title)"
          ' "$FILE" \
          | sort -nr \
          | head -20

          echo ""
          echo "===== NEXT TOPIC CANDIDATES ====="

          cat > /tmp/candidates.json <<'EOF'
          [
            {
              "rank": 1,
              "topic": "How to Read a CBC Report",
              "category": "CBC / Hematology",
              "angle": "How to Read / Interpretation",
              "historical_average": 229.7,
              "historical_posts": 27,
              "search_intent": 9,
              "opportunity": 92,
              "confidence": "HIGH"
            },
            {
              "rank": 2,
              "topic": "How to Read an HbA1c Report",
              "category": "Diabetes / Glucose",
              "angle": "How to Read / Interpretation",
              "historical_average": 170.9,
              "historical_posts": 82,
              "search_intent": 10,
              "opportunity": 97,
              "confidence": "HIGH"
            },
            {
              "rank": 3,
              "topic": "How to Read ALT, AST and ALP",
              "category": "Liver / Hepatitis",
              "angle": "How to Read / Interpretation",
              "historical_average": 145.9,
              "historical_posts": 31,
              "search_intent": 8,
              "opportunity": 90,
              "confidence": "HIGH"
            },
            {
              "rank": 4,
              "topic": "Creatinine and eGFR Explained",
              "category": "Kidney / Renal",
              "angle": "Test / Diagnosis",
              "historical_average": 196,
              "historical_posts": 1,
              "search_intent": 9,
              "opportunity": 90,
              "confidence": "LOW"
            },
            {
              "rank": 5,
              "topic": "Blood Glucose Results Explained",
              "category": "Diabetes / Glucose",
              "angle": "Test / Diagnosis",
              "historical_average": 134.75,
              "historical_posts": 16,
              "search_intent": 10,
              "opportunity": 93,
              "confidence": "MEDIUM"
            },
            {
              "rank": 6,
              "topic": "Liver Function Test Interpretation",
              "category": "Liver / Hepatitis",
              "angle": "How to Read / Interpretation",
              "historical_average": 145.9,
              "historical_posts": 31,
              "search_intent": 9,
              "opportunity": 89,
              "confidence": "HIGH"
            },
            {
              "rank": 7,
              "topic": "CBC Test and Diagnosis",
              "category": "CBC / Hematology",
              "angle": "Test / Diagnosis",
              "historical_average": 127.3,
              "historical_posts": 34,
              "search_intent": 9,
              "opportunity": 90,
              "confidence": "HIGH"
            },
            {
              "rank": 8,
              "topic": "Blood Collection Guide",
              "category": "Specimen Collection",
              "angle": "Guide / Steps",
              "historical_average": 130.3,
              "historical_posts": 18,
              "search_intent": 7,
              "opportunity": 82,
              "confidence": "MEDIUM"
            },
            {
              "rank": 9,
              "topic": "TSH, T3 and T4 Explained",
              "category": "Thyroid",
              "angle": "How to Read / Interpretation",
              "historical_average": 81,
              "historical_posts": 5,
              "search_intent": 9,
              "opportunity": 87,
              "confidence": "LOW"
            }
          ]
          EOF

          echo ""
          echo "===== FILTERING ALREADY PUBLISHED TOPICS ====="

          jq -r '.[].title // empty' "$FILE" \
            | tr '[:upper:]' '[:lower:]' \
            > /tmp/published_titles.txt

          jq -c '.[]' /tmp/candidates.json \
          | while read -r candidate; do
              TOPIC=$(echo "$candidate" | jq -r '.topic')

              if grep -Fqi "$TOPIC" /tmp/published_titles.txt; then
                echo "Already detected: $TOPIC"
              else
                echo "Available: $TOPIC"
              fi
            done

          echo ""
          echo "===== FINAL NEXT TOPIC ====="

          NEXT=$(jq -c '
            sort_by(
              (
                (.opportunity * 0.40)
                + ((.historical_average / 5) * 0.30)
                + (.search_intent * 3)
                + (
                    if .confidence == "HIGH" then 10
                    elif .confidence == "MEDIUM" then 5
                    else 0
                    end
                  )
              )
            )
            | reverse
            | .[0]
          ' /tmp/candidates.json)

          echo "$NEXT" | jq .

          TOPIC=$(echo "$NEXT" | jq -r '.topic')
          CATEGORY=$(echo "$NEXT" | jq -r '.category')
          ANGLE=$(echo "$NEXT" | jq -r '.angle')
          OPPORTUNITY=$(echo "$NEXT" | jq -r '.opportunity')
          HISTORICAL_AVG=$(echo "$NEXT" | jq -r '.historical_average')
          CONFIDENCE=$(echo "$NEXT" | jq -r '.confidence')

          echo ""
          echo "Topic: $TOPIC"
          echo "Category: $CATEGORY"
          echo "Angle: $ANGLE"
          echo "Opportunity: $OPPORTUNITY"
          echo "Historical average shares: $HISTORICAL_AVG"
          echo "Confidence: $CONFIDENCE"

          mkdir -p output

          cat > output/mls_next_topic.txt <<EOF
          ===== MLS NEXT TOPIC =====

          Topic: $TOPIC
          Category: $CATEGORY
          Recommended angle: $ANGLE

          Opportunity score: $OPPORTUNITY
          Historical average shares: $HISTORICAL_AVG
          Evidence confidence: $CONFIDENCE

          ===== NEXT ACTION =====

          Research USA search intent.
          Validate medical evidence.
          Build content angle.
          Generate title.
          Generate content.
          Generate image prompt.
          Generate image.
          Publish to Facebook.

          ===== MLS NEXT TOPIC COMPLETE =====
          EOF

          echo ""
          cat output/mls_next_topic.txt

      - name: Upload next topic
        uses: actions/upload-artifact@v4
        with:
          name: mls-next-topic
          path: output/mls_next_topic.txt
